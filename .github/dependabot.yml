version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ml-stack:
        patterns: ["torch", "torchvision", "transformers", "accelerate", "rembg*", "onnxruntime*"]
      dev-tools:
        patterns: ["pytest*", "black", "ruff", "mypy", "httpx2"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
