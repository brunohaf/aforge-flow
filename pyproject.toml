# AForge Flow monorepo — uv workspace root (virtual; not a package itself).
#
#   uv sync                          # whole workspace (CLI + API) into .venv
#   uv sync --package aforge-flow    # just the CLI/pipeline (no FastAPI)
#   uv run aforge --help             # run the CLI
#   uv run aforge-api --root .       # run the web API
#
# See README.md for the full guide.

[tool.uv.workspace]
members = ["aforge_flow", "aforge_flow_api"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.27",
    "black>=23.7.0",
    "ruff>=0.0.280",
    "mypy>=1.4.0",
]

# --- Shared tooling configuration -------------------------------------------

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", "__pycache__", "dist", "build", ".venv"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["aforge_flow/tests", "aforge_flow_api/tests"]
markers = [
    "gpu: integration tests that require a CUDA device and downloaded model weights",
]
