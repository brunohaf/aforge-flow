[build-system]
requires = ["setuptools>=65.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aforge_flow"
dynamic = ["version"]
description = "GPU-accelerated artwork pipeline: category-aware background removal, optimization, naming and zero-shot classification"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Bruno Fonseca"}
]
keywords = ["background-removal", "rembg", "birefnet", "image-optimization", "webp", "image-processing", "zero-shot-classification", "siglip", "clip", "gpu", "cuda", "tabletop", "ttrpg", "dnd", "vtt", "game-assets"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: GPU :: NVIDIA CUDA",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

dependencies = [
    # 2.0.76 is the version RembgModel names are validated against (config.py).
    "rembg[gpu]>=2.0.76",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
    "structlog>=23.1.0",
    "psutil>=5.9",
    # Lazily imported by background_removal.py (edge refinement / alpha matting).
    "scipy>=1.10",
    "pymatting>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.15",
    "mypy>=1.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx2>=2.13",  # starlette.testclient backend (web API tests)
]
video = [
    "ffmpeg-python>=0.2.0",
    "av>=10.0.0",
]
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",  # required for file uploads
]
classify = [
    # >=5.10 clears PYSEC-2026-2288/2289/3929 (RCE, path traversal); 5.x renamed
    # `torch_dtype` to `dtype`. <6 until the next major is validated with `make tests-gpu`.
    "transformers>=5.10,<6",
    "accelerate>=0.30.0",
    # Optional: 4-bit VLM fallback on CUDA. Safe to omit (falls back to fp16).
    "bitsandbytes>=0.43.0; platform_system == 'Linux'",
]

[project.urls]
Homepage = "https://github.com/brunohaf/aforge-flow"
Source = "https://github.com/brunohaf/aforge-flow"
Issues = "https://github.com/brunohaf/aforge-flow/issues"
Changelog = "https://github.com/brunohaf/aforge-flow/blob/main/CHANGELOG.md"

[project.scripts]
aforge = "aforge_flow.cli:main"

# uv: install CUDA builds of PyTorch on Windows/Linux (PyPI ships CPU-only
# torch wheels for Windows). cu126 is used for the widest NVIDIA driver support.
# macOS falls through to the default PyPI wheels. Applies to `uv sync`/`uv lock`.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

# Version comes from the latest vX.Y.Z git tag (created by the release workflow).
[tool.setuptools_scm]
fallback_version = "0.1.0"

[tool.setuptools]
packages = ["aforge_flow", "aforge_flow.processors", "aforge_flow.utils", "aforge_flow.web", "aforge_flow.web.routes"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
aforge_flow = ["creature_names.json"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", "__pycache__", "dist", "build"]

# Explicit selection so results do not drift with ruff's evolving defaults.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line length is black's job
    "UP042",  # StrEnum changes str() of the public enums
]

[tool.ruff.lint.isort]
known-first-party = ["aforge_flow"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "web/node_modules", "build", "dist"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["aforge_flow"]
branch = false

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
# Adapters that load real model weights; exercised by the `gpu`-marked tests instead.
exclude_also = [
    "class _BlipBackend",
    "class _QwenBackend",
    "class ClipEncoder",
    "class QwenVLClassifier",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "gpu: integration tests that require a CUDA device and downloaded model weights",
]
