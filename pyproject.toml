[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aforge_flow"
version = "0.1.0"
description = "GPU-accelerated tabletop/VTT asset pipeline for batch background removal, image cleaning, media transcoding, and creature classification"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AForge Flow Contributors"}
]
keywords = ["background-removal", "rembg", "video-optimization", "image-processing", "gpu", "cuda"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: GPU :: NVIDIA CUDA",
]

dependencies = [
    "rembg[gpu]>=0.0.52",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
    "structlog>=23.1.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.280",
    "mypy>=1.4.0",
    "pytest-asyncio>=0.21.0",
]
video = [
    "ffmpeg-python>=0.2.1",
    "av>=10.0.0",
]
web = [
    # Local browser UI for the pipeline (``aforge web``).
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",  # required for file uploads
]
classify = [
    # Zero-shot CLIP-family classification + optional VLM fallback.
    # Lower bound: 4.49 first ships the Qwen2.5-VL (`qwen2_5_vl`) architecture.
    # Upper bound: 5.x is a major rewrite (e.g. `torch_dtype`->`dtype`) not yet
    # validated against the BLIP/SigLIP/CLIP paths here.
    "transformers>=4.49.0,<5",
    "accelerate>=0.30.0",
    # Optional: 4-bit VLM fallback on CUDA. Safe to omit (falls back to fp16).
    "bitsandbytes>=0.43.0; platform_system == 'Linux'",
]

[project.scripts]
aforge = "aforge_flow.cli:main"

[tool.setuptools]
packages = ["aforge_flow", "aforge_flow.processors", "aforge_flow.utils", "aforge_flow.web", "aforge_flow.web.routes"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
aforge_flow = ["creature_names.json"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", "__pycache__", "dist", "build"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "gpu: integration tests that require a CUDA device and downloaded model weights",
]
