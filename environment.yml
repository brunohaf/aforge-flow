name: asset-forge

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.11
  - ffmpeg
  - pillow
  - click
  - pydantic
  - ipython
  - scipy
  - pip

  - pip:
      # PyTorch CUDA 12.1 wheels (conda pytorch channel is deprecated)
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - -e .
      - torch
      - torchvision
      - torchaudio
      - opencv-python-headless
      - rembg[gpu]==2.0.76
      - pymatting
      - python-dotenv
      - transformers==4.46.3
      - accelerate
      - tqdm
      - structlog
      - rich
      - av
      - pytest
      - pytest-cov
      - black
      - ruff

# conda run -n asset-forge python -c "import torch; print(torch.__version__, torch.cuda.is_available());import onnxruntime;print(onnxruntime.get_available_providers());"
