name: aforge-flow

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.11
  - ffmpeg
  - pillow
  - click
  - pydantic
  - ipython
  - scipy
  - pip

  - pip:
      # PyTorch CUDA 12.1 wheels (conda pytorch channel is deprecated)
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - -e . # installs aforge cli
      - torch
      - torchvision
      - torchaudio
      - opencv-python-headless
      - rembg[gpu]==2.0.76
      - pymatting
      - python-dotenv
      - transformers>=4.49  # qwen2_5_vl architecture support (added in 4.49.0)
      - bitsandbytes==0.49.2
      - accelerate
      - tqdm
      - structlog
      - rich
      - av
      - pytest
      - pytest-cov
      - black
      - ruff
